<html lang="vi">
<head>
 <meta charset="UTF-8">

 <!-- Google Fonts phong cách Trung Hoa / Á Đông -->
 <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@600;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
 <style>
 :root {
 --primary-red: #8B0000;
 --bright-red: #C0392B;
 --gold: #D4AC0D;
 --dark-gold: #B7950B;
 --bg-wood: #2C1A1D;
 --card-bg: #FFFDF9;
 --text-dark: #2C2C2C;
 --border-gold: #E5C158;
 }

 * {
 box-sizing: border-box;
 margin: 0;
 padding: 0;
 font-family: 'Roboto', sans-serif;
 }

 body {
 background-color: var(--bg-wood);
 background-image: radial-gradient(#3D2328 15%, transparent 16%), radial-gradient(#3D2328 15%, transparent 16%);
 background-size: 60px 60px;
 background-position: 0 0, 30px 30px;
 color: var(--text-dark);
 padding-bottom: 100px;
 }

 /* HEADER & LOGO */
 header {
 background: linear-gradient(180deg, #5C0000 0%, var(--primary-red) 100%);
 border-bottom: 4px solid var(--gold);
 text-align: center;
 padding: 20px 15px;
 box-shadow: 0 4px 15px rgba(0,0,0,0.5);
 position: relative;
 }

 .logo-container {
 display: inline-block;
 line-height: 0;
 }

 .logo-container img {
 width: 100px;
 height: 100px;
 object-fit: contain;
 border-radius: 50%;
 border: 3px solid var(--gold);
 background-color: #FFF;
 box-shadow: 0 0 12px rgba(212, 172, 13, 0.6);
 }

 .shop-title {
 font-family: 'Noto Serif TC', serif;
 color: var(--gold);
 font-size: 1.8rem;
 margin-top: 10px;
 text-shadow: 2px 2px 4px #000;
 }

 .shop-sub {
 font-family: 'Ma Shan Zheng', cursive;
 color: #FFF;
 font-size: 1.5rem;
 letter-spacing: 2px;
 }

 /* BỘ LỌC & TÌM KIẾM */
 .controls-container {
 position: sticky;
 top: 0;
 z-index: 100;
 background-color: var(--primary-red);
 padding: 10px 15px;
 border-bottom: 2px solid var(--gold);
 box-shadow: 0 4px 10px rgba(0,0,0,0.3);
 }

 .search-box input {
 width: 100%;
 padding: 10px 15px;
 border-radius: 20px;
 border: 2px solid var(--gold);
 background-color: #FFFDF9;
 font-size: 0.95rem;
 outline: none;
 }

 .categories-scroll {
 display: flex;
 overflow-x: auto;
 gap: 8px;
 margin-top: 10px;
 padding-bottom: 5px;
 white-space: nowrap;
 }

 .categories-scroll::-webkit-scrollbar {
 height: 4px;
 }
 .categories-scroll::-webkit-scrollbar-thumb {
 background: var(--gold);
 border-radius: 10px;
 }

 .cat-btn {
 background-color: #5C0000;
 color: #FFF;
 border: 1px solid var(--gold);
 padding: 6px 14px;
 border-radius: 15px;
 font-size: 0.85rem;
 cursor: pointer;
 transition: all 0.2s;
 }

 .cat-btn.active, .cat-btn:hover {
 background-color: var(--gold);
 color: var(--primary-red);
 font-weight: bold;
 }

 /* DANH SÁCH MÓN ĐẠNG LƯỚI */
 .container {
 max-width: 1200px;
 margin: 20px auto;
 padding: 0 10px;
 }

 .menu-grid {
 display: grid;
 grid-template-columns: repeat(2, 1fr);
 gap: 12px;
 }

 @media (min-width: 768px) {
 .menu-grid {
 grid-template-columns: repeat(4, 1fr);
 gap: 20px;
 }
 }

 .food-card {
 background-color: var(--card-bg);
 border: 2px solid var(--border-gold);
 border-radius: 8px;
 overflow: hidden;
 display: flex;
 flex-direction: column;
 justify-content: space-between;
 position: relative;
 box-shadow: 0 4px 8px rgba(0,0,0,0.3);
 transition: transform 0.2s;
 }

 .food-card:hover {
 transform: translateY(-3px);
 }

 .food-img {
 width: 100%;
 height: 120px;
 object-fit: cover;
 border-bottom: 1px solid var(--border-gold);
 }

 .food-info {
 padding: 8px;
 flex-grow: 1;
 display: flex;
 flex-direction: column;
 }

 .food-title {
 font-size: 0.95rem;
 font-weight: bold;
 color: var(--primary-red);
 margin-bottom: 4px;
 }

 .food-desc {
 font-size: 0.75rem;
 color: #666;
 margin-bottom: 8px;
 flex-grow: 1;
 display: -webkit-box;
 -webkit-line-clamp: 2;
 -webkit-box-orient: vertical;
 overflow: hidden;
 }

 .food-bottom {
 display: flex;
 justify-content: space-between;
 align-items: center;
 margin-top: 5px;
 }

 .food-price {
 font-weight: bold;
 color: var(--bright-red);
 font-size: 0.9rem;
 }

 .btn-add {
 background-color: var(--primary-red);
 color: var(--gold);
 border: 1px solid var(--gold);
 padding: 4px 10px;
 border-radius: 4px;
 cursor: pointer;
 font-weight: bold;
 font-size: 0.8rem;
 }

 .out-of-stock {
 opacity: 0.6;
 filter: grayscale(0.8);
 }
 .badge-out {
 position: absolute;
 top: 5px; right: 5px;
 background: #000; color: #FFF;
 font-size: 0.65rem; padding: 2px 6px; border-radius: 3px;
 }

 /* NÚT GIỎ HÀNG NỔI */
 .cart-float-btn {
 position: fixed;
 bottom: 20px;
 right: 20px;
 background: linear-gradient(135deg, var(--gold), var(--dark-gold));
 color: var(--primary-red);
 padding: 12px 20px;
 border-radius: 30px;
 font-weight: bold;
 box-shadow: 0 4px 15px rgba(0,0,0,0.5);
 cursor: pointer;
 z-index: 999;
 display: flex;
 align-items: center;
 gap: 8px;
 border: 2px solid #FFF;
 }

 .cart-badge {
 background-color: var(--primary-red);
 color: #FFF;
 border-radius: 50%;
 padding: 2px 7px;
 font-size: 0.8rem;
 }

 /* MODAL GIỎ HÀNG */
 .modal {
 display: none;
 position: fixed;
 top: 0; left: 0; width: 100%; height: 100%;
 background: rgba(0,0,0,0.7);
 z-index: 1000;
 justify-content: center;
 align-items: center;
 }

 .modal-content {
 background: var(--card-bg);
 width: 95%;
 max-width: 550px;
 max-height: 90vh;
 border-radius: 10px;
 border: 3px solid var(--gold);
 overflow-y: auto;
 padding: 15px;
 position: relative;
 }

 .modal-header {
 display: flex;
 justify-content: space-between;
 align-items: center;
 border-bottom: 2px solid var(--gold);
 padding-bottom: 8px;
 color: var(--primary-red);
 }

 .close-btn {
 font-size: 1.5rem;
 cursor: pointer;
 color: var(--primary-red);
 }

 .cart-item {
 display: flex;
 justify-content: space-between;
 align-items: center;
 padding: 8px 0;
 border-bottom: 1px dashed #DDD;
 }

 .qty-btn {
 width: 26px; height: 26px;
 background: var(--primary-red);
 color: #FFF;
 border: none;
 border-radius: 4px;
 cursor: pointer;
 font-weight: bold;
 }

 .customer-form {
 margin-top: 15px;
 display: flex;
 flex-direction: column;
 gap: 10px;
 }

 .customer-form input, .customer-form textarea {
 width: 100%;
 padding: 8px 10px;
 border: 1px solid #CCC;
 border-radius: 4px;
 font-size: 0.9rem;
 }

 .radio-group {
 display: flex;
 gap: 20px;
 background: #FFF0F0;
 padding: 10px;
 border-radius: 5px;
 border: 1px solid #FFCDD2;
 }

 .radio-option {
 display: flex;
 align-items: center;
 gap: 6px;
 cursor: pointer;
 font-size: 0.9rem;
 font-weight: 500;
 }

 .btn-confirm {
 background: var(--primary-red);
 color: var(--gold);
 border: 1px solid var(--gold);
 padding: 10px;
 font-size: 1rem;
 font-weight: bold;
 border-radius: 5px;
 cursor: pointer;
 width: 100%;
 }

 .share-grid {
 display: grid;
 grid-template-columns: repeat(2, 1fr);
 gap: 8px;
 margin-top: 10px;
 }

 .btn-share {
 padding: 10px 8px;
 border-radius: 5px;
 border: none;
 color: #FFF;
 font-weight: bold;
 cursor: pointer;
 font-size: 0.85rem;
 display: flex;
 align-items: center;
 justify-content: center;
 gap: 5px;
 }

 .btn-copy { background: #333; }
 .btn-zalo { background: #0068FF; }
 .btn-mes { background: #0084FF; }
 .btn-sms { background: #27AE60; }
 .btn-call { background: #C0392B; grid-column: span 2; }
 .btn-native { background: #8E44AD; grid-column: span 2; }

 .btn-modal-close {
 background: #7F8C8D;
 color: #FFF;
 width: 100%;
 padding: 10px;
 margin-top: 15px;
 border: none;
 border-radius: 5px;
 font-weight: bold;
 cursor: pointer;
 font-size: 0.95rem;
 }

 .summary-box {
 background: #FFF0F0;
 padding: 10px;
 border-radius: 5px;
 margin-top: 10px;
 border: 1px solid #FFCDD2;
 }

 /* KHUYẾN MÃI BOX */
 .promo-box {
 display: flex;
 gap: 8px;
 margin-top: 10px;
 }
 .promo-box input {
 flex-grow: 1;
 padding: 8px 10px;
 border: 1px solid var(--gold);
 border-radius: 4px;
 font-size: 0.85rem;
 text-transform: uppercase;
 }
 .promo-box button {
 background: var(--primary-red);
 color: var(--gold);
 border: 1px solid var(--gold);
 padding: 8px 15px;
 font-weight: bold;
 border-radius: 4px;
 cursor: pointer;
 font-size: 0.85rem;
 }
 .promo-message {
 font-size: 0.8rem;
 margin-top: 4px;
 font-weight: 500;
 }
 </style>

 <!-- HEADER LOGO -->
 <header>
 <div class="logo-container">
 <img id="shop-logo" src="https://raw.githubusercontent.com/amthucphucgiaky/menu/refs/heads/main/Logo.png" alt="Ẩm Thực Phúc Gia Ký Logo">
 </div>
 <h1 class="shop-title">MENU PHÚC GIA KÝ</h1>
 <div class="shop-sub">福 家 记</div>
 </header>

 <!-- BỘ LỌC VÀ TÌM KIẾM -->
 <div class="controls-container">
 <div class="search-box">
 <input type="text" id="search-input" placeholder="🔎 Tìm món ăn hoặc mô tả..." oninput="filterMenu()">
 </div>
 <div class="categories-scroll" id="cat-list"></div>
 </div>

 <!-- DANH SÁCH MÓN ĐẠNG LƯỚI -->
 <div class="container">
 <div class="menu-grid" id="menu-grid"></div>
 </div>

 <!-- NÚT GIỎ HÀNG NỔI -->
 <div class="cart-float-btn" onclick="openCart()">
 🛍 <span>Giỏ hàng</span>
 <span class="cart-badge" id="cart-count">0</span>
 </div>

 <!-- MODAL GIỎ HÀNG & ĐẶT HÀNG -->
 <div class="modal" id="cart-modal">
 <div class="modal-content">
 <div class="modal-header">
 <h3>🛍️ Giỏ Hàng PHÚC GIA KÝ</h3>
 <span class="close-btn" onclick="closeCart()">&times;</span>
 </div>

 <div id="cart-items-list" style="margin-top: 10px;"></div>

 <!-- KHU VỰC NHẬP MÃ KHUYẾN MÃI -->
 <div class="promo-box">
 <input type="text" id="promo-code-input" placeholder="Mã khuyến mãi (VD: CHUCQUYKHACHNGONMIENG)">
 <button type="button" onclick="applyPromoCode()">Áp dụng</button>
 </div>
 <div class="promo-message" id="promo-msg"></div>

 <div class="summary-box">
 <div style="display: flex; justify-content: space-between; font-size: 0.95rem; color: #555;">
 <span>Tạm tính:</span>
 <strong id="sub-total">0đ</strong>
 </div>
 <div id="discount-row" style="display: none; justify-content: space-between; font-size: 0.95rem; color: #27AE60; margin-top: 4px;">
 <span>Giảm giá (<span id="discount-percent">0</span>%):</span>
 <strong id="discount-amount">-0đ</strong>
 </div>
 <hr style="border: 0; border-top: 1px dashed #FFCDD2; margin: 6px 0;">
 <div style="display: flex; justify-content: space-between; font-size: 1.1rem; color: var(--primary-red);">
 <span>TỔNG CỘNG MÓN:</span>
 <strong id="grand-total">0đ</strong>
 </div>
 </div>

 <!-- THÔNG TIN KHÁCH HÀNG -->
 <form class="customer-form" id="order-form" onsubmit="event.preventDefault(); createOrder();">
 <h4 style="color: var(--primary-red); margin-top: 5px;">📝 Thông tin khách hàng</h4>
 <input type="text" id="cust-name" placeholder="Họ và tên (*)" required oninput="saveCustomerInfo()">
 <input type="tel" id="cust-phone" placeholder="Số điện thoại (*)" required oninput="saveCustomerInfo()">
 
 <div class="radio-group">
 <label class="radio-option">
 <input type="radio" name="deliveryMethod" value="SHIP" checked onchange="toggleDeliveryMode()"> Giao tận nơi (Có phí)
 </label>
 <label class="radio-option">
 <input type="radio" name="deliveryMethod" value="PICKUP" onchange="toggleDeliveryMode()"> Khách đến lấy
 </label>
 </div>
 
 <div id="address-container">
 <input type="text" id="cust-address" placeholder="Địa chỉ nhận hàng (*)" required oninput="saveCustomerInfo()">
 </div>
 
 <textarea id="cust-note" rows="2" placeholder="Ghi chú thêm (ví dụ: Không cay, ít hành...)"></textarea>

 <button type="submit" class="btn-confirm" id="submit-btn">📲 XÁC NHẬN VÀ GỞI BẾP PHÍA DƯỚI ⏬</button>
 </form>

 <!-- KHU VỰC SAU KHI TẠO ĐƠN -->
 <div id="order-success-area" style="display: none; margin-top: 15px; border-top: 2px dashed var(--gold); padding-top: 10px;">
 <h4 style="color: #27AE60; text-align: center;">✅ Đã tạo đơn thành công!</h4>
 <p style="font-size: 0.8rem; color: #555; text-align: center;">Đơn hàng đã được COPY, khách có thể mở ứng dụng phía dưới để gửi hoặc chọn "Chia sẻ đơn hàng".</p>
 
 <textarea id="order-text-output" rows="6" readonly style="width: 100%; margin-top: 5px; font-size: 0.8rem; background: #F9F9F9; padding: 5px;"></textarea>

 <div class="share-grid">
 <button class="btn-share btn-copy" onclick="copyOrderText(true)">📋 Sao chép lại đơn hàng</button>
 <button class="btn-share btn-zalo" onclick="sendZalo()">💬 Mở Zalo & Dán</button>
 <button class="btn-share btn-mes" onclick="sendMessenger()">💬 Mở Messenger & Dán</button>
 <button class="btn-share btn-sms" onclick="sendSMS()">📱 Gửi SMS</button>
 <button class="btn-share btn-call" onclick="callShop()">☎️ Gọi trực tiếp cho quán</button>
 <button class="btn-share btn-native" onclick="nativeShare()">📤 Chia sẻ đơn hàng (Khuyên dùng)</button>
 </div>
 </div>

 <button class="btn-modal-close" onclick="closeCart()">❌ Đóng</button>
 </div>
 </div>

 // BIẾN GIỎ HÀNG & MÃ KHUYẾN MÃI
 let cart = {};
 let currentCategory = "Tất cả";
 let appliedDiscountPercent = 0;
 const PROMO_CODES = {
 "TETTRUNGTHU2026": 10,
 "PHUCGIAKY555": 5,
 "PHUCGIAKY101010": 10
 };

 // KHỞI TẠO TẢI TRANG
 window.onload = function() {
 renderCategories();
 renderMenu();
 loadCustomerInfo();
 };

 function renderCategories() {
 const catList = document.getElementById('cat-list');
 catList.innerHTML = categories.map(cat => 
 `<button class="cat-btn ${cat === currentCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">${cat}</button>`
 ).join('');
 }

 function selectCategory(cat) {
 currentCategory = cat;
 renderCategories();
 filterMenu();
 }

 function renderMenu(items = menuData) {
 const grid = document.getElementById('menu-grid');
 grid.innerHTML = items.map(item => `
 <div class="food-card ${item.isOut ? 'out-of-stock' : ''}">
 ${item.isOut ? '<span class="badge-out">Hết món</span>' : ''}
 <img src="${item.image}" class="food-img" alt="${item.name}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1496116218417-1a781b1c416c?w=300'">
 <div class="food-info">
 <div class="food-title">${item.name}</div>
 <div class="food-desc">${item.desc}</div>
 <div class="food-bottom">
 <span class="food-price">${item.price.toLocaleString('vi-VN')}đ</span>
 <button class="btn-add" ${item.isOut ? 'disabled' : ''} onclick="addToCart(${item.id})">+ Thêm</button>
 </div>
 </div>
 </div>
 `).join('');
 }

 function filterMenu() {
 const keyword = document.getElementById('search-input').value.toLowerCase().trim();
 const filtered = menuData.filter(item => {
 const matchesCat = (currentCategory === "Tất cả") || (item.category === currentCategory);
 const matchesSearch = item.name.toLowerCase().includes(keyword) || item.desc.toLowerCase().includes(keyword);
 return matchesCat && matchesSearch;
 });
 renderMenu(filtered);
 }

 function addToCart(id) {
 const item = menuData.find(f => f.id === id);
 if (!item || item.isOut) return;
 cart[id] = (cart[id] || 0) + 1;
 updateCartUI();
 }

 function updateQty(id, delta) {
 if (cart[id]) {
 cart[id] += delta;
 if (cart[id] <= 0) delete cart[id];
 }
 updateCartUI();
 }

 function updateCartUI() {
 const countSpan = document.getElementById('cart-count');
 const listDiv = document.getElementById('cart-items-list');
 let totalQty = 0;
 let subTotal = 0;
 let html = '';

 for (let id in cart) {
 const qty = cart[id];
 const item = menuData.find(f => f.id == id);
 if (item) {
 totalQty += qty;
 const itemTotal = item.price * qty;
 subTotal += itemTotal;
 html += `
 <div class="cart-item">
 <div>
 <strong style="color: var(--primary-red); font-size: 0.9rem;">${item.name}</strong><br>
 <small style="color: #666;">${item.price.toLocaleString('vi-VN')}đ x ${qty} = ${itemTotal.toLocaleString('vi-VN')}đ</small>
 </div>
 <div style="display: flex; gap: 5px; align-items: center;">
 <button class="qty-btn" onclick="updateQty(${id}, -1)">-</button>
 <span>${qty}</span>
 <button class="qty-btn" onclick="updateQty(${id}, 1)">+</button>
 </div>
 </div>
 `;
 }
 }

 countSpan.innerText = totalQty;
 listDiv.innerHTML = html || '<p style="text-align: center; color: #888; margin: 15px 0;">Giỏ hàng trống</p>';

 document.getElementById('sub-total').innerText = subTotal.toLocaleString('vi-VN') + 'đ';
 
 const discountAmount = Math.round(subTotal * (appliedDiscountPercent / 100));
 const grandTotal = subTotal - discountAmount;

 if (appliedDiscountPercent > 0) {
 document.getElementById('discount-row').style.display = 'flex';
 document.getElementById('discount-percent').innerText = appliedDiscountPercent;
 document.getElementById('discount-amount').innerText = '-' + discountAmount.toLocaleString('vi-VN') + 'đ';
 } else {
 document.getElementById('discount-row').style.display = 'none';
 }

 document.getElementById('grand-total').innerText = grandTotal.toLocaleString('vi-VN') + 'đ';
 }

 function applyPromoCode() {
 const codeInput = document.getElementById('promo-code-input').value.trim().toUpperCase();
 const msgDiv = document.getElementById('promo-msg');
 
 if (PROMO_CODES[codeInput]) {
 appliedDiscountPercent = PROMO_CODES[codeInput];
 msgDiv.style.color = '#27AE60';
 msgDiv.innerText = `✅ Đã áp dụng mã thành công! Giảm ${appliedDiscountPercent}%.`;
 } else {
 appliedDiscountPercent = 0;
 msgDiv.style.color = '#C0392B';
 msgDiv.innerText = '❌ Mã khuyến mãi không hợp lệ hoặc đã hết hạn!';
 }
 updateCartUI();
 }

 function openCart() {
 document.getElementById('cart-modal').style.display = 'flex';
 }

 function closeCart() {
 document.getElementById('cart-modal').style.display = 'none';
 }

 function toggleDeliveryMode() {
 const deliveryMethod = document.querySelector('input[name="deliveryMethod"]:checked').value;
 const addressContainer = document.getElementById('address-container');
 const addressInput = document.getElementById('cust-address');

 if (deliveryMethod === 'PICKUP') {
 addressContainer.style.display = 'none';
 addressInput.removeAttribute('required');
 } else {
 addressContainer.style.display = 'block';
 addressInput.setAttribute('required', 'true');
 }
 }

 function saveCustomerInfo() {
 const info = {
 name: document.getElementById('cust-name').value,
 phone: document.getElementById('cust-phone').value,
 address: document.getElementById('cust-address').value
 };
 localStorage.setItem('pgk_cust_info', JSON.stringify(info));
 }

 function loadCustomerInfo() {
 const saved = localStorage.getItem('pgk_cust_info');
 if (saved) {
 try {
 const info = JSON.parse(saved);
 document.getElementById('cust-name').value = info.name || '';
 document.getElementById('cust-phone').value = info.phone || '';
 document.getElementById('cust-address').value = info.address || '';
 } catch(e) {}
 }
 }

 function generateOrderText() {
 const name = document.getElementById('cust-name').value.trim();
 const phone = document.getElementById('cust-phone').value.trim();
 const method = document.querySelector('input[name="deliveryMethod"]:checked').value;
 const address = document.getElementById('cust-address').value.trim();
 const note = document.getElementById('cust-note').value.trim();

 let itemsText = '';
 let subTotal = 0;
 let idx = 1;

 for (let id in cart) {
 const qty = cart[id];
 const item = menuData.find(f => f.id == id);
 if (item) {
 const itemTotal = item.price * qty;
 subTotal += itemTotal;
 itemsText += `${idx}. ${item.name} x${qty} = ${itemTotal.toLocaleString('vi-VN')}đ\n`;
 idx++;
 }
 }

 const discountAmount = Math.round(subTotal * (appliedDiscountPercent / 100));
 const grandTotal = subTotal - discountAmount;

 let text = `🚩 ĐƠN HÀNG ẨM THỰC PHÚC GIA KÝ (福家记) 🚩\n`;
 text += `------------------------------------\n`;
 text += `👤 Khách hàng: ${name}\n`;
 text += `📞 SĐT: ${phone}\n`;
 text += `Hình thức: ${method === 'SHIP' ? '🚚 Giao tận nơi' : '🏪 Khách đến lấy'}\n`;
 if (method === 'SHIP') {
 text += `🏠 Địa chỉ: ${address}\n`;
 }
 if (note) {
 text += `📝 Ghi chú: ${note}\n`;
 }
 text += `------------------------------------\n`;
 text += `📋 DANH SÁCH MÓN:\n${itemsText}`;
 text += `------------------------------------\n`;
 text += `Tạm tính: ${subTotal.toLocaleString('vi-VN')}đ\n`;
 if (appliedDiscountPercent > 0) {
 text += `Giảm giá (${appliedDiscountPercent}%): -${discountAmount.toLocaleString('vi-VN')}đ\n`;
 }
 text += `👉 TỔNG CỘNG MÓN: ${grandTotal.toLocaleString('vi-VN')}đ\n`;
 text += `------------------------------------\n`;
 text += `💕Cảm ơn Quý Khách đã ủng hộ Phúc Gia Ký!💕`;

 return text;
 }

 function createOrder() {
 if (Object.keys(cart).length === 0) {
 alert("Giỏ hàng của bạn đang trống! Vui lòng chọn món trước.");
 return;
 }
 const orderText = generateOrderText();
 document.getElementById('order-text-output').value = orderText;
 document.getElementById('order-success-area').style.display = 'block';
 copyOrderText(false);
 }

 function copyOrderText(showAlert = true) {
 const text = document.getElementById('order-text-output').value;
 if (!text) return;
 navigator.clipboard.writeText(text).then(() => {
 if (showAlert) alert("📋 Đã sao chép đơn hàng vào khay nhớ tạm!");
 }).catch(err => {
 const area = document.getElementById('order-text-output');
 area.select();
 document.execCommand('copy');
 if (showAlert) alert("📋 Đã sao chép đơn hàng!");
 });
 }

 function sendZalo() {
 // 1. Thực hiện sao chép đơn hàng vào Clipboard
    copyOrderText(false); 
    
    // 2. Chuyển hướng trực tiếp thay vì mở cửa sổ mới để không bị chặn Pop-up
    // Sử dụng link Zalo Me hoặc URL Scheme của Zalo
    const zaloPhone = SHOP_PHONE; // Hoặc link Zalo OA/cá nhân của bạn
    window.location.href = `https://zalo.me/${zaloPhone}`;
 }

 function sendMessenger() {
 copyOrderText(false);
 window.open(MESSENGER_LINK, '_blank');
 }

 function sendSMS() {
 const text = document.getElementById('order-text-output').value;
 window.open(`sms:${SHOP_PHONE}?body=${encodeURIComponent(text)}`, '_self');
 }

 function callShop() {
 window.open(`tel:${SHOP_PHONE}`, '_self');
 }

 function nativeShare() {
 const text = document.getElementById('order-text-output').value;
 if (navigator.share) {
 navigator.share({
 title: 'Đơn hàng Ẩm Thực Phúc Gia Ký',
 text: text
 }).catch(err => {});
 } else {
 copyOrderText(true);
 }
 }
 </script>
</body>
</html>
